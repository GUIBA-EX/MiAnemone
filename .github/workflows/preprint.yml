name: Check and publish preprint
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mianemone-preprint-main
  cancel-in-progress: false
jobs:
  preprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install biopython matplotlib
      - name: Verify records and manuscript tables
        run: |
          python scripts/verify.py
          python scripts/check_preprint.py
      - name: Determine whether research inputs changed
        id: version
        run: |
          tag=$(git tag --list 'preprint-v1.*' --sort=-version:refname | head -1)
          echo "previous=$tag" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet "$tag" HEAD -- 12S 16S audit figures publications scripts/verify.py scripts/independent.py scripts/base_matching.py scripts/binding_positions.py scripts/template_matching.py all_results.csv primers.fasta; then
            echo "next=1.$(( ${tag##*.} + 1 ))" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild and version research artifacts
        if: steps.version.outputs.next != ''
        env:
          VERSION: ${{ steps.version.outputs.next }}
          CHROME: /usr/bin/google-chrome
        run: |
          sudo apt-get update -qq && sudo apt-get install -y pandoc poppler-utils
          python scripts/binding_positions.py
          python scripts/base_matching.py
          python scripts/template_matching.py
          python publications/plot_results.py
          python scripts/stamp_preprint.py "$VERSION"
          python publications/build_preprint.py
          pdfinfo publications/MiAnemone_preprint.pdf
          pdftotext publications/MiAnemone_preprint.pdf /tmp/paper.txt
          python scripts/check_preprint.py /tmp/paper.txt
          sha256sum publications/MiAnemone_preprint.pdf primers.fasta | sed 's@  publications/@  @' > publications/SHA256SUMS.txt
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git commit -m "Publish computational preprint v$VERSION"
          git tag -a "preprint-v$VERSION" -m "MiAnemone preprint v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/preprint-v$VERSION"
      - name: Complete tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.next && format('preprint-v{0}', steps.version.outputs.next) || steps.version.outputs.previous }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "MiAnemone computational preprint ${TAG#preprint-}" --notes "Fei Xia. Version ${TAG#preprint-v}. Computational preprint; not peer reviewed. The PDF, primer FASTA and SHA-256 checksums correspond to the tagged source."
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            dir=$(mktemp -d)
            for file in publications/MiAnemone_preprint.pdf publications/SHA256SUMS.txt primers.fasta; do
              git show "$TAG:$file" > "$dir/${file##*/}"
            done
            (cd "$dir" && sha256sum -c SHA256SUMS.txt)
            gh release upload "$TAG" "$dir"/* --clobber
            gh release edit "$TAG" --draft=false
          fi
