name: Validate preprint
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          python -m pip install -r publications/requirements-preprint.txt
      - name: Validate scientific data and committed publication
        run: |
          python scripts/verify.py
          python scripts/check_figures.py
          python scripts/check_28S.py
          python scripts/check_readme_catalogue.py
          pdftotext -layout publications/MiAnemone_preprint.pdf /tmp/paper.txt
          python scripts/check_preprint.py /tmp/paper.txt
          python scripts/check_publication.py
          python scripts/preprint_integrity.py
          git diff --exit-code -- publications/SHA256SUMS.txt
